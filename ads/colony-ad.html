<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Colony Food Market Ad</title>
<!--
  One template, several cuts. URL options (combine freely):
    ?lang=enes (default, English + Spanish) | ?lang=pa (Papiamento)
    ?fmt=vertical (default, 1080x1920)      | ?fmt=square (1080x1080)
    ?cut=full (default, 32 s)               | ?cut=short (15 s)
  Render with render.js (see ads/README.md).
-->
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--lagoon:#12B3A5;--deep:#0B3B39;--teal:#0E7C73;--sun:#FFD400;--coral:#FF5B4A;--cream:#FFF9DE;--aqua:#7FE3D9;--H:1920px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:var(--H);overflow:hidden;background:var(--deep)}
body{font-family:"Baloo 2",sans-serif;color:#fff}
#stage{position:relative;width:1080px;height:var(--H);overflow:hidden;
  background:linear-gradient(180deg,#0A8FC0 0%,#2BB5E0 35%,#9BE6F5 62%,#D8F7FB 66%)}
#bg{position:absolute;inset:0}
#bg svg{position:absolute;left:0;top:0}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.9;filter:blur(2px)}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:180%;left:12%;top:-90%}
.cloud::after{width:40%;height:140%;left:50%;top:-60%}
#topshade{position:absolute;left:0;right:0;top:0;height:42%;background:linear-gradient(180deg,rgba(6,60,90,.45),rgba(6,60,90,0))}
.sunball{position:absolute;border-radius:50%;background:radial-gradient(circle,#FFE44D 0%,#FFD400 55%,rgba(255,212,0,0) 72%)}
.wave{position:absolute;left:-60px;width:1200px;height:220px}
.scene{position:absolute;inset:0;opacity:0}
.el{position:absolute;will-change:transform,opacity}
.kicker{font-family:"Bungee";font-size:40px;letter-spacing:4px;color:var(--sun);
  background:var(--deep);padding:10px 26px;border-radius:999px;left:50%;white-space:nowrap}
.h1{font-family:"Bungee";font-size:112px;line-height:1.0;text-align:center;width:1000px;left:40px;
  text-shadow:0 8px 0 rgba(11,59,57,.55)}
.h1 .y{color:var(--sun)}
.sub{font-weight:800;font-size:60px;line-height:1.1;text-align:center;width:1000px;left:40px;color:var(--cream);
  text-shadow:0 4px 0 rgba(11,59,57,.75),0 0 22px rgba(6,50,70,.55)}
.card{border-radius:44px;overflow:hidden;background:#fff;border:14px solid #fff;
  box-shadow:0 30px 60px rgba(11,59,57,.45)}
.card img{width:100%;height:100%;object-fit:cover;display:block;border-radius:30px}
.sticker{font-family:"Bungee";background:var(--sun);color:var(--deep);border-radius:999px;
  padding:16px 34px;font-size:46px;box-shadow:0 10px 0 var(--deep);white-space:nowrap}
.sticker.coral{background:var(--coral);color:#fff}
.stars{font-size:96px;letter-spacing:6px;color:var(--sun);text-shadow:0 6px 0 var(--deep);text-align:center;width:1080px;left:0}
.quote{font-weight:800;font-size:50px;line-height:1.15;text-align:center;width:900px;left:90px;color:var(--deep);
  background:var(--cream);border-radius:36px;padding:28px 36px;box-shadow:0 14px 0 rgba(11,59,57,.4)}
.quote small{font-size:36px;color:#0E7C73}
.info{left:70px;width:940px;background:rgba(11,59,57,.82);border-radius:36px;padding:34px 44px;font-size:46px;font-weight:800;line-height:1.25}
.info b{color:var(--sun);font-family:"Bungee";font-weight:400;font-size:44px}
.info .row{display:flex;gap:26px;align-items:center;margin:6px 0}
.info .ic{width:66px;flex:0 0 66px;text-align:center}
.wa{left:90px;width:900px;background:#25D366;border-radius:999px;padding:24px 0;text-align:center;
  font-family:"Bungee";font-size:58px;color:#fff;box-shadow:0 12px 0 #128C4A}
.wa small{display:block;font-family:"Baloo 2";font-weight:800;font-size:34px;letter-spacing:1px;margin-top:-6px}
.logo{background:rgba(255,249,222,.94);border-radius:60px;padding:26px 40px;height:auto!important;box-shadow:0 14px 0 rgba(11,59,57,.35)}
.logo img{width:100%;display:block}

/* ---------- square 1080x1080: text column left, photos right ---------- */
body.square{--H:1080px}
body.square .scene:not(.end) .h1{font-size:60px!important;width:520px;text-align:left}
body.square .scene:not(.end) .sub{font-size:38px;width:500px;text-align:left}
body.square .scene:not(.end) .kicker{font-size:26px;padding:8px 20px;letter-spacing:2px}
body.square .scene:not(.end) .sticker{font-size:32px;padding:12px 26px;box-shadow:0 8px 0 var(--deep)}
body.square .scene:not(.end) .stars{font-size:64px;width:auto;text-align:left}
body.square .scene:not(.end) .quote{font-size:34px;width:500px;text-align:left;padding:20px 26px}
body.square .scene:not(.end) .quote small{font-size:26px}
body.square .card{border-width:10px;border-radius:34px}
body.square .card img{border-radius:24px}
body.square .end .logo{left:60px!important;top:150px!important;width:380px!important;height:auto!important}
body.square .end .t1{left:40px!important;top:500px!important;width:420px!important;font-size:42px!important}
body.square .end .t2{left:40px!important;top:570px!important;width:420px!important;font-size:34px!important}
body.square .end .info{left:500px!important;top:120px!important;width:540px!important;font-size:32px;padding:26px 30px}
body.square .end .info b{font-size:32px}
body.square .end .info .ic{width:44px;flex-basis:44px}
body.square .end .wa{left:500px!important;top:640px!important;width:540px!important;font-size:44px;padding:18px 0}
body.square .end .wa small{font-size:28px}
body.square .end .url{left:500px!important;top:820px!important;width:540px!important;font-size:34px!important}
</style>
</head>

<script>
const T={
 enes:{
  kAruba:"ARUBA · SAN NICOLAS",
  beachH:'GOING TO<br><span class="y">BABY BEACH?</span>', beachS:"¿Vas a Baby Beach?", beachT:"+ RODGERS BEACH",
  visitH:'COME SAY<br><span class="y">HI!</span>', visitS:"¡Ven a visitarnos!", visitT:"📍 SEROE COLORADO",
  stopH:'STOP AT<br><span class="y">COLONY</span><br>FIRST!', stopS:"¡Pasa primero por Colony!", stopT:"5 MIN FROM THE BEACH", stopS2:"A 5 minutos de la playa",
  drinksH:'ICE-COLD<br><span class="y">DRINKS & BEER</span>', drinksS:"Bebidas y cerveza fría", drinksT:"❄ SUPER COLD",
  iceH:'BAGS OF<br><span class="y">ICE</span>', iceS:"Bolsas de hielo para tu cooler", iceT:"FOR YOUR COOLER",
  snacksH:'SNACKS, CANDY<br><span class="y">& ICE CREAM</span>', snacksS:"Snacks, dulces y helados", snacksT:"🍦 YUM!",
  gearH:'SUNSCREEN<br><span class="y">& SOUVENIRS</span>', gearS:"Protector solar y recuerdos de Aruba", gearT:"☀ BEACH DAY",
  localK:"LIVE NEARBY? · ¿VIVES CERCA?", localH:'EVERYDAY<br><span class="y">BASICS</span>', localS:"Huevos, queso, galletas y lo básico de todos los días", localT:"🛵 WE DELIVER!", localS2:"¡Hacemos delivery! Pide por WhatsApp",
  ownH:'BOB & SHA<br><span class="y">WELCOME YOU</span>', ownS:"Bob y Sha te esperan", ownQ:'“A tiny gem 5 min away from Baby Beach!”<br><small>— Google review</small>',
  endH:"YOUR BEACH STOP", endS:"Tu parada antes de la playa", endNear:"5 min · Baby Beach & Rodgers Beach",
  endHours:"<b>OPEN DAILY 11:00–20:00</b><br>Abierto todos los días", endWa:"WHATSAPP<small>+297 748 3926</small>"
 },
 pa:{
  kAruba:"ARUBA · SAN NICOLAS",
  beachH:'BO TA BAI<br><span class="y">BABY BEACH?</span>', beachS:"Pasa aki riba bo caminda pa playa", beachT:"+ RODGERS BEACH",
  visitH:'BIN<br><span class="y">BISHITA NOS!</span>', visitS:"Riba e caminda pa Baby Beach", visitT:"📍 SEROE COLORADO",
  stopH:'UN STOP<br><span class="y">CORTICO</span><br>NA COLONY', stopS:"prome cu bo yega playa", stopT:"CERCA DI PLAYA", stopS2:"Riba e caminda pa Baby Beach",
  drinksH:'BEBIDA<br><span class="y">FRIU</span>', drinksS:"Cerbes friu i refresco", drinksT:"❄ FRIU!",
  iceH:'SACO DI<br><span class="y">IJS</span>', iceS:"Tur loke bo mester pa un dia na playa", iceT:"PA BO COOLER",
  snacksH:'SNACKS<br><span class="y">I MANGEL</span>', snacksS:"Chips, mangel i ijs", snacksT:"🍦 IJS!",
  gearH:'SUNSCREEN<br><span class="y">I SOUVENIR</span>', gearS:"Proteccion pa solo i souvenir di Aruba", gearT:"☀ PA PLAYA",
  localK:"BO TA BIBA CERCA?", localH:'COSNAN DI<br><span class="y">TUR DIA</span>', localS:"Webo, keshi, buscuchi i mas, cerca di cas", localT:"🛵 NOS TA HACI DELIVERY!", localS2:"Manda nos un WhatsApp cu bo lista i bo adres",
  ownH:'BOB I SHA<br><span class="y">BON BINI!</span>', ownS:"Loke nos clientenan ta bisa:", ownQ:'“A tiny gem 5 min away from Baby Beach!”<br><small>— Google review</small>',
  endH:"BO MINI MARKET LOCAL", endS:"na Seroe Colorado 1525", endNear:"Banda di Baby Beach i Rodgers Beach",
  endHours:"<b>NOS TA HABRI 11:00–20:00</b><br>Djaluna – Djadumingo", endWa:"WHATSAPP<small>Manda nos un mensahe · +297 748 3926</small>"
 }
};
const Q=new URLSearchParams(location.search);
const LANG=T[Q.get('lang')]?Q.get('lang'):'enes', SQUARE=Q.get('fmt')==='square', SHORT=Q.get('cut')==='short';
document.documentElement.lang=LANG==='pa'?'pap':'en';
document.querySelectorAll('[data-k]').forEach(e=>{e.innerHTML=T[LANG][e.dataset.k]});
if(SQUARE)document.body.classList.add('square');
const H=SQUARE?1080:1920;

// 15 s cut: keep the strongest scenes, compress their timing
if(!SHORT){let t=0;document.querySelectorAll('.scene').forEach(s=>{s.dataset.start=t;t+=+s.dataset.dur;s.dataset.end=t;});}
if(SHORT){
  const keep={beach:2.3,stop:2.2,visit:2.2,drinks:1.9,ice:1.6,snacks:1.8,end:3.0};
  let t=0;
  document.querySelectorAll('.scene').forEach(s=>{
    const d=keep[s.dataset.id];
    if(!d){s.remove();return}
    s.dataset.start=t;s.dataset.end=t+d;t+=d;
    if(s.dataset.id!=='end')s.querySelectorAll('.el').forEach(e=>e.dataset.d=(+e.dataset.d||0)*.6);
  });
}
const scenes=[...document.querySelectorAll('.scene')].map(s=>({s,a:+s.dataset.start,b:+s.dataset.end,els:[...s.querySelectorAll('.el')]}));
window.TOTAL=+scenes[scenes.length-1].s.dataset.end;

// center stickers flagged data-center (vertical layout)
document.querySelectorAll('[data-center]').forEach(e=>{e.style.left=((1080-e.offsetWidth)/2)+'px'});

// square layout: stack text/stickers in the left column, photos on the right
function layoutSquare(){
  for(const sc of scenes){
    if(sc.s.classList.contains('end'))continue;
    const cards=sc.els.filter(e=>e.classList.contains('card')), texts=sc.els.filter(e=>!e.classList.contains('card'));
    texts.forEach(e=>{e.style.left='56px';e.style.right='auto';if(e.dataset.a==='drop')e.dataset.a='up';});
    const gap=22, hs=texts.map(e=>e.offsetHeight), tot=hs.reduce((a,b)=>a+b,0)+gap*(texts.length-1);
    let y=Math.max(70,(1080-tot)/2-20);
    texts.forEach((e,i)=>{e.style.top=y+'px';y+=hs[i]+gap;e.style.transformOrigin='left center'});
    if(cards.length===1){const c=cards[0],img=c.querySelector('img'),ar=img.naturalWidth/img.naturalHeight;
      let w=450,h=Math.min(860,w/ar); if(h<520){h=520} if(ar>1.2){w=470;h=Math.max(520,w/ar*1.15)}
      Object.assign(c.style,{left:(600+(470-w)/2)+'px',top:((1080-h)/2)+'px',width:w+'px',height:h+'px'});}
    else{Object.assign(cards[0].style,{left:'590px',top:'90px',width:'440px',height:'470px'});
         Object.assign(cards[1].style,{left:'560px',top:'540px',width:'470px',height:'420px'});}
  }
}

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const easeOut=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const $=id=>document.getElementById(id), sun=$('sun');
// beach geometry
const HZ=SQUARE?600:1250, SANDY=SQUARE?930:1700;
$('beach').setAttribute('height',H);$('beach').setAttribute('viewBox',`0 0 1080 ${H}`);
$('sea').setAttribute('y',HZ);$('sea').setAttribute('height',H-HZ);
const SH=[];for(let i=0;i<22;i++){const e=document.createElementNS('http://www.w3.org/2000/svg','ellipse');
  const y=HZ+8+Math.pow(i/22,1.6)*(SANDY-HZ-40);e.setAttribute('cy',y);e.setAttribute('ry',2+i*.15);e.setAttribute('fill','#fff');
  $('shimmer').appendChild(e);SH.push({e,x:(i*397)%1080,w:30+(i*53)%90,sp:8+(i*7)%14,ph:i*1.7});}
const clouds=[['c1',120,.9,9],['c2',230,.6,14],['c3',70,.75,6]];
$('palm').setAttribute('transform',SQUARE?'translate(30,1080) scale(.62)':'translate(50,1920) scale(.95)');
function edge(t,off,amp){let d='';const surge=Math.sin(t*1.05)*(SQUARE?16:26);
  for(let x=-20;x<=1100;x+=20){const y=SANDY+off+surge+amp*Math.sin(x/120+t*1.4)+amp*.5*Math.sin(x/47-t*2.1);d+=(x<0?'M':'L')+x+' '+y.toFixed(1)+' ';}return d;}
function drawBeach(t){
  // sun resting on the horizon, slowly bobbing
  sun.style.left=(SQUARE?690:700)+Math.sin(t*.3)*12+'px';sun.style.top=(HZ-(SQUARE?330:360)+Math.sin(t*.5)*8)+'px';
  for(const [id,y,s,sp] of clouds){const el=$(id);el.style.top=(SQUARE?y*.7:y+40)+'px';el.style.left=((((t*sp)+ (id==='c2'?500:id==='c3'?820:150))%1300)-200)+'px';el.style.transform=`scale(${s})`;}
  for(const o of SH){const x=(o.x+t*o.sp)%1180-50, a=.25+.35*Math.max(0,Math.sin(t*2+o.ph));
    o.e.setAttribute('cx',x);o.e.setAttribute('rx',o.w);o.e.setAttribute('opacity',a.toFixed(2));}
  const top=edge(t,0,9);
  $('sand').setAttribute('d',edge(t-.35,26,7)+`L1100 ${H} L-20 ${H}Z`);
  $('wet').setAttribute('d',top+`L1100 ${H} L-20 ${H}Z`);
  $('foam').setAttribute('d',top);$('foam2').setAttribute('d',edge(t+.6,-26,6));
  $('leaves').setAttribute('transform',`translate(90,-640) rotate(${Math.sin(t*1.3)*4})`);
  // store footage frames
  for(const sc of scenes){if(sc.s.dataset.id!=='visit')continue;const lt=t-sc.a;
    if(lt<0||t>=sc.b)continue;const n=Math.min(CLIPN,1+Math.floor(lt*30*(SHORT?1.4:1))%CLIPN);
    const img=sc.s.querySelector('img.clip'),src='clip/f'+String(n).padStart(3,'0')+'.jpg';if(!img.src.endsWith(src))img.src=src;}
}
const CLIPN=108; const CLIP=[];for(let i=1;i<=CLIPN;i++){const im=new Image();im.src='clip/f'+String(i).padStart(3,'0')+'.jpg';CLIP.push(im);}
window.render=function(t){
  drawBeach(t);

  for(const sc of scenes){
    const lt=t-sc.a, last=sc===scenes[scenes.length-1];
    const fadeOut=last?1:clamp((sc.b-t)/.3);
    const vis=t>=sc.a-0.001&&t<sc.b;
    sc.s.style.opacity=vis?fadeOut:0;
    if(!vis)continue;
    const outShift=last?0:(1-fadeOut)*-80;
    for(const e of sc.els){
      const p=clamp((lt-(+e.dataset.d||0))/.45), a=e.dataset.a, r=+(e.dataset.r||0);
      let tr='',op=clamp(p*2.5);
      if(a==='up')tr=`translateY(${(1-easeOut(p))*90}px)`;
      else if(a==='drop')tr=`translateX(-50%) translateY(${(1-easeOut(p))*-70}px)`;
      else if(a==='pop')tr=`scale(${p<=0?0:back(p)})`;
      else if(a==='card'){const fl=Math.sin((lt)*1.6+r)*1.2;tr=`translateY(${(1-easeOut(p))*260}px) rotate(${r*(0.4+0.6*easeOut(p))+fl}deg) scale(${0.85+0.15*easeOut(p)})`;
        const img=e.querySelector('img');if(img)img.style.transform=`scale(${1.04+lt*.025})`;}
      e.style.opacity=op;e.style.transform=`translateY(${outShift}px) `+tr;
    }
  }
};
window.READY=Promise.all([document.fonts.ready,...CLIP.map(i=>i.decode().catch(()=>0)),...[...document.images].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r}))]).then(()=>{
  // measurements depend on fonts/images, so run them once both are loaded
  if(SQUARE)layoutSquare();
  else document.querySelectorAll('[data-center]').forEach(e=>{e.style.left=((1080-e.offsetWidth)/2)+'px'});
});
render(0);
</script>
</body>
</html>
